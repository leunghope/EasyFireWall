name: Publish edge

# Multi-arch container builds for the public demo deployment.
#
# Triggers on every push to main. The image is pushed to GHCR under the :edge
# and :sha-<sha> tags. The public demo follows :edge on its own: a scheduled
# reset outside this repository recreates it every six hours with the image
# pulled fresh. Nothing here reaches the demo host.
#
# Released versions are handled separately by release.yml + GoReleaser
# and use the :latest and :vX.Y.Z tags. The two flows do not overlap.

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # ── Build per platform on a native runner, push by digest only ──────────
  # Cross-compiling Go inside a multi-arch buildx with QEMU is dramatically
  # slower than running native amd64 + native arm64 in parallel. Each job
  # uploads its digest as an artifact; the merge job creates the manifest.
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Prepare platform suffix
        id: platform
        run: echo "suffix=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/leunghope/easyfirewall

      # Build a single-platform image and push it by digest (no tag yet).
      # GHA cache is scoped per platform so the layers don't mix.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=edge-${{ github.sha }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=ghcr.io/leunghope/easyfirewall,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.platform.outputs.suffix }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.suffix }}

      # Write an empty file named after the digest (without the "sha256:" prefix)
      # so the merge job can reconstruct the full reference list.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.platform.outputs.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7

  # ── Pull both digests and create a multi-arch manifest in all 3 registries
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Generate :edge and :sha-<sha> tags. GHCR is the only registry this fork
      # publishes to: the upstream repository also mirrors to Docker Hub and
      # Quay, but there are no credentials here, and a registry whose namespace
      # comes from an empty secret renders as `docker.io//easywall` — a name
      # metadata-action will not accept, failing a build that had already
      # succeeded.
      - name: Extract tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/leunghope/easyfirewall
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail

          # The per-platform builds pushed by digest; this assembles them into
          # one multi-arch manifest and gives it the :edge and :sha-<sha> tags.
          tag_args=$(jq -cr '.tags | map("-t " + .) | join(" ")' \
            <<< "$DOCKER_METADATA_OUTPUT_JSON")
          [ -n "$tag_args" ] || { echo "::error::metadata-action produced no tags"; exit 1; }
          # shellcheck disable=SC2086
          docker buildx imagetools create $tag_args \
            $(printf 'ghcr.io/leunghope/easyfirewall@sha256:%s ' *)

      - name: Inspect published image
        run: docker buildx imagetools inspect ghcr.io/leunghope/easyfirewall:edge
