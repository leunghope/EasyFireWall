version: 2

project_name: easywall

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: easywall-core
    main: ./cmd/easywall-core
    binary: easywall-core
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/jp1337/easywall/internal/shared.CurrentVersion={{.Version}}

  - id: easywall-web
    main: ./cmd/easywall-web
    binary: easywall-web
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/jp1337/easywall/internal/shared.CurrentVersion={{.Version}}

archives:
  - id: default
    name_template: "easywall_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - web/**
      - locales/**
      - config/*.toml
      - systemd/*.service
      - README.md
      - LICENSE
      - CHANGELOG.md

release:
  # Every tag in this fork carries a `-zh.N` suffix, which semver reads as a
  # prerelease part — with `auto` every release here would be published as a
  # prerelease, and a prerelease is never "the latest release" on GitHub. The
  # documented install command, /releases/latest/download/easywall_amd64.deb,
  # then answers 404 on a repository whose only releases are prereleases.
  # This fork releases one line, and that line is the current one.
  prerelease: false

checksum:
  name_template: "checksums.txt"

changelog:
  # GoReleaser diffs the previous tag to write the release body. The GitHub
  # remote starts without a single tag, so "since the previous tag" is the
  # entire history and the body would be every commit ever made. The body is
  # the CHANGELOG.md section for the version instead — release.yml writes it
  # in the step after this one, from the same file the documentation site
  # renders, so there is still only one place a release note is written.
  disable: true

dockers_v2:
  # GHCR only. Upstream built the same image three times and pushed it to GHCR,
  # Docker Hub and Quay; this fork has credentials for none of the mirrors, and a
  # registry named from an empty secret renders as `docker.io//easywall`, which
  # the push rejects — taking the release with it *after* the images had already
  # been written. v2.4.0 upstream hit the same shape when Quay answered 401 and
  # GoReleaser aborted before creating the GitHub release, leaving no binaries
  # and no notes. A mirror is a convenience; the release is not.
  - id: primary
    dockerfile: Dockerfile
    images:
      - "ghcr.io/leunghope/easyfirewall"
    tags:
      # `.Tag` keeps the `v` — `:v2.29.2-zh.2` — which is what every example in
      # installation/docker.md prints (`:v{{ site.version }}`) and what upstream
      # shipped. The .deb carries the same version without it, because dpkg has
      # its own idea of a version string; both are the same release.
      - "{{ .Tag }}"
      # `latest` moves with every release here. Upstream held it back on
      # prereleases because a `-rc` tag would otherwise repoint the tag that
      # installation/docker.md calls the production one; in this fork every
      # release is a `-zh.N`, so holding it back would mean `:latest` never
      # moved at all — and docker-compose.yml pulls `:latest` when VERSION is
      # unset.
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      VERSION: "{{ .Version }}"
      # The commit the release was cut from. The Dockerfile turns it into
      # org.opencontainers.image.revision, which installation/docker.md tells
      # operators to read back — and which release images did not carry at all.
      REVISION: "{{ .FullCommit }}"
    extra_files:
      - go.mod
      - go.sum
      - cmd/
      - internal/
      - web/
      - locales/
      - config/
      - docker/
