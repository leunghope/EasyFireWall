name: probe

# Temporary. Answer four questions before the release pipeline is written:
#   1. does this instance run workflows at all, and does hk_runner pick them up?
#   2. can actions/checkout be fetched (does the runner reach github.com)?
#   3. does `container:` work, and can golang:1.27.3-bookworm be pulled?
#   4. is a docker daemon reachable from inside the job, and is qemu registered?
#
# Deleted once the answers are in; the release pipeline lives in release.yml.

on:
  push:
    tags:
      - "probe-*"

jobs:
  info:
    name: runner info
    runs-on: hk_runner
    env:
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
      HAS_REGISTRY_USER: ${{ secrets.REGISTRY_USER != '' }}
    steps:
      - name: checkout (actions/checkout@v4)
        uses: actions/checkout@v4

      - name: the checkout landed
        run: |
          set -euo pipefail
          ls -a | head -20
          git rev-parse HEAD
          git status --short | head

      - name: diagnostics
        run: |
          set -euo pipefail
          echo "== uname =="; uname -a
          echo "== id =="; id
          echo "== cgroup =="; cat /proc/1/cgroup 2>/dev/null | head -3 || true
          echo "== context =="
          echo "server_url=${{ github.server_url }}"
          echo "server_url_raw=${{ github.server_url }}"
          echo "repository=${{ github.repository }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "sha=${{ github.sha }}"
          echo "== secrets present =="
          echo "RELEASE_TOKEN set: ${HAS_RELEASE_TOKEN}"
          echo "REGISTRY_USER set: ${HAS_REGISTRY_USER}"
          echo "== tools =="
          for c in go dpkg-buildpackage dpkg-deb dh git curl jq tar gzip docker buildx node npm sudo apt-get; do
            if command -v "$c" >/dev/null 2>&1; then printf '%-18s %s\n' "$c" "$(command -v "$c")"; else printf '%-18s MISSING\n' "$c"; fi
          done
          echo "== go =="; go version 2>&1 || true
          echo "== docker =="; docker version 2>&1 | head -25 || true
          echo "== binfmt =="; ls /proc/sys/fs/binfmt_misc 2>/dev/null || echo "no binfmt_misc"

  container:
    name: container support
    runs-on: hk_runner
    container: golang:1.27.3-bookworm
    steps:
      - name: go and debian tools inside the container
        run: |
          set -euo pipefail
          uname -a
          go version
          cat /etc/os-release | head -3
          dpkg-buildpackage --version | head -1 || echo "dpkg-buildpackage MISSING"
          apt-get --version | head -1 || echo "apt-get MISSING"
          command -v docker || echo "docker MISSING in container"

  docker:
    name: docker daemon
    runs-on: hk_runner
    steps:
      - name: can we talk to a daemon
        run: |
          set -euo pipefail
          docker info 2>&1 | head -30 || echo "docker info FAILED"
          echo "== buildx =="
          docker buildx version 2>&1 || echo "buildx MISSING"
          echo "== socket =="
          ls -l /var/run/docker.sock 2>&1 || echo "no docker.sock"
          echo "== binfmt (host) =="
          ls /proc/sys/fs/binfmt_misc 2>/dev/null || echo "no binfmt_misc"